[[rule]]
id = "sujet-abstrait"
family = "agent"
severity = "warn"
escalate_at = 5
flags = ""
pattern = '''(?:^|[.!?]\s+|: )(?:La|Le|L['’]|Cette|Cet|Ce|Une|Un|Votre|Notre)\s?(?:stratégie|approche|méthode|méthodologie|solution|outil|plateforme|technologie|modèle|processus|système|dispositif|programme|démarche|offre|produit|fonctionnalité|framework|logiciel|automatisation|innovation|accompagnement|formation|contenu|architecture|cadre|tableau de bord|pipeline|workflow)\s+(?:\w+\s+){0,3}?(?:permet|permettent|garantit|garantissent|offre|offrent|assure|assurent|transforme|transforment|aide|aident|apporte|apportent|facilite|facilitent|renforce|renforcent|favorise|favorisent|optimise|optimisent|simplifie|simplifient|libère|libèrent|accélère|accélèrent|vous aide|vous permet|vous offre|vous libère)\b'''
message = "Un nom abstrait agit à la place d'une personne."
fix = "Mettre une personne en sujet : vous, on, le client."
bad = ["Cette plateforme vous permet de gagner du temps."]
good = ["Vous gagnez deux heures par semaine avec la plateforme."]

[[rule]]
id = "foule-vague"
family = "source"
severity = "warn"
escalate_at = 2
pattern = '''\b(?:la plupart|la majorité|beaucoup|la moitié|nombre|trop|peu) d(?:es|e) (?:fondateurs|founders|startups|équipes|entrepreneurs|entreprises|gens|personnes|utilisateurs|clients|marques|experts|candidats|investisseurs)\b'''
message = "Foule invoquée sans donnée."
fix = "Nommer un cas, ou donner la donnée."
bad = ["La plupart des fondateurs sous-estiment le BFR."]
good = ["Sur nos 40 dossiers, 31 sous-estimaient le BFR."]

[[rule]]
id = "pourcentage-population"
family = "source"
severity = "block"
unless = '''\]\(|https?://|\[\^|\bsource\b|\bselon\b|\bd['’]après\b|\(\w+,? \d{4}\)'''
pattern = '''\b\d{1,3} ?% des (?:startups|fondateurs|founders|entreprises|candidats|investisseurs|utilisateurs|équipes|projets|clients|prospects|gens|personnes|Français|salariés|managers|consommateurs)\b'''
message = "Pourcentage appliqué à une population, sans source dans la phrase."
fix = "Mettre la source dans la phrase, ou supprimer le chiffre."
bad = ["80 % des startups échouent la première année."]
good = ["Selon l'Insee, 30 % des entreprises disparaissent avant trois ans."]

[[rule]]
id = "verbe-anglais"
family = "vocabulaire"
severity = "warn"
pattern = '''\b(?:shipp?(?:er|é|ée|és|ez|ent)|scal(?:er|é|ée|és|ez)|seed(?:é|ée|és)|fitt?(?:er|é)|ping(?:er|é|ue)|build(?:er|é|ent|ez)|refactor(?:er|é)|skipp?(?:er|é|ez)|lock(?:er|é)|vest(?:er|é)|curat(?:er|é|ée)|plugg?(?:er|é|ée)|disrupt(?:er|é|ent)|onboard(?:er|é|ée|és|ent)|délivr(?:er|e|ent|é|ée|és))\b'''
message = "Verbe anglais conjugué à la française."
fix = "Livrer, passer à l'échelle, intégrer, perturber."
bad = ["On a shippé la version 2."]
good = ["On a livré la version 2."]

# ---------------------------------------------------------------- annonces

[[rule]]
id = "annonce-outillage"
family = "structure"
severity = "block"
pattern = '''\b(?:j['’]ai|nous avons|on a) besoin (?:de |d['’])(?:un|deux|trois) (?:mots?|notions?|concepts?|idées?)\b|\bil (?:me|nous) faut (?:un|deux|trois) (?:mots?|notions?|concepts?)\b|(?:^|[.!?] )(?:Deux|Trois|Quatre|Quelques) exemples (?:montrent|illustrent|permettent)\b|\bje (?:reviendrai|vais revenir) (?:à la fin|plus loin|plus tard|en conclusion)\b|\bje reviens pour finir\b'''
message = "Le texte annonce ce qu'il va faire au lieu de le faire."
fix = "Écrire directement la définition, l'exemple ou le retour au sujet."
bad = ["Pour expliquer cette histoire, j'ai besoin de deux mots.", "Je reviendrai à la fin sur ce point."]
good = ["La zemblanité désigne la découverte malheureuse."]

[[rule]]
id = "annonce-demande"
family = "structure"
severity = "block"
pattern = '''\b(?:notre|la|ma|une) (?:demande|requête|priorité) principale\b'''
message = "Annonce de la demande."
fix = "Formuler la demande seule, en fin de texte."
bad = ["Notre demande principale tient en une ligne."]
good = ["Pourriez-vous nous présenter à Marie ?"]

[[rule]]
id = "rituel-fin"
family = "rituel"
severity = "block"
pattern = '''\bn['’]hésitez (?:pas|surtout pas) à\b'''
message = "« N'hésitez pas à » : formule de fin automatique."
fix = "Nommer l'action : « répondez à cet email », « appelez le 01... »."
bad = ["N'hésitez pas à nous contacter."]
good = ["Répondez à cet email avant vendredi."]

[[rule]]
id = "scene-inventee"
family = "image"
scope = "first_sentence"
kinds = ["paragraph"]
severity = "block"
flags = ""
pattern = '''^[A-ZÉ][\w-]+(?: [A-ZÉ][\w-]+)?, un (?:matin|soir|après-midi|lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|jour)\b'''
message = "Ouverture sur une scène inventée."
fix = "Ouvrir sur un fait sourcé."
bad = ["Lyon, un mardi matin à la Confluence. Marc ouvre son ordinateur."]
good = ["Le 4 mars 2025, Marc a signé son premier client."]

[[rule]]
id = "meta-seo"
family = "rituel"
severity = "block"
pattern = '''\ble SERP\b|\bguides? concurrents?\b|\baucun (?:guide|article|comparatif|contenu) (?:français|francophone|en français)\b|\bnulle part ailleurs\b|\bles autres (?:guides|articles|comparatifs)\b|\binformation gain\b|\bmots?-clés? (?:cible|principal|secondaire)\b|\bsi vous (?:avez )?cherch(?:ez|é) [«"]'''
message = "Le brief SEO fuit dans le texte."
fix = "Le lecteur ne connaît pas le brief : supprimer, dire le fait."
bad = ["Contrairement aux guides concurrents, nous détaillons le calcul."]
good = ["Le calcul détaillé suit."]

[[rule]]
id = "faire-la-difference"
family = "remplissage"
severity = "block"
pattern = '''\bf(?:ont|ait|aire|era|eront|aisait) (?:toute )?la différence\b|\b(?:vaut|valent) (?:de l['’]or|son pesant d['’]or)\b|\b(?:n['’]est pas|ce n['’]est pas|pas) (?:anodin|anecdotique|un détail|négligeable)\b'''
message = "Cliché de valeur sans fait."
fix = "Dire la différence mesurée."
bad = ["Ce détail fait toute la différence.", "Ce n'est pas anodin."]
good = ["Ce détail réduit le churn de 2 points."]
