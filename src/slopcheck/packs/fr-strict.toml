# Standard strict : en plus des signatures IA, ce pack interdit des tournures
# que de bons auteurs humains emploient (voix passive, « pas X mais Y »,
# « vraiment », règle de trois). Il vise une prose sèche et factuelle :
# posts, emails, pages de vente, documentation. Sur le corpus humain de
# référence, il lève environ un BLOCK pour 800 mots : c'est voulu.
# Origine : règles de rédaction de swanbase (Paris), août-octobre 2026.

[pack]
name = "fr-strict"
description = "Standard strict de prose factuelle, au-delà des signatures IA"
extends = ["fr-signatures"]

# ---------------------------------------------------------------- durcissements

[[rule]]
id = "em-dash"
severity = "block"
escalate_at = 0

[[rule]]
id = "etiquette-relative"
severity = "block"

[[rule]]
id = "veritable"
severity = "block"

[[rule]]
id = "non-seulement-mais"
severity = "block"

[[rule]]
id = "participe-final"
severity = "block"

[[rule]]
id = "autorite-vague"
severity = "block"

[[rule]]
id = "intertitres-questions"
severity = "block"

[[rule]]
id = "conclusion-rituelle"
severity = "block"

# ---------------------------------------------------------------- titres

[[rule]]
id = "ce-que-ce-qui"
family = "titre"
scope = "title"
kinds = ["heading", "paragraph", "list"]
severity = "block"
pattern = '''^\W*Ce\s+(?:qui|que|qu['’]|dont)\b'''
message = "Titre ou étiquette ouvert par « Ce que / Ce qui »."
fix = "Nommer la chose au lieu de l'annoncer."
bad = ["## Ce qui reste de votre côté"]
good = ["## Vos tâches restantes"]

# ---------------------------------------------------------------- correction en deux temps

[[rule]]
id = "pas-mais"
family = "structure"
scope = "sentence"
severity = "block"
pattern = '''^\W*Pas\s+\w[^,.]{0,40},\s*mais\b|\bnon pas\b[^.]{0,40}\bmais\b'''
message = "« Pas X, mais Y » / « non pas X mais Y »."
fix = "Affirmer Y directement."
bad = ["Pas un outil, mais une méthode.", "Il vend non pas des logiciels mais du conseil."]
good = ["Il vend du conseil."]

[[rule]]
id = "contraste-appose"
severity = "block"

[[rule]]
id = "negation-trainante"
family = "structure"
severity = "block"
pattern = '''\bne\s+\w+\s+pas\s+\w[^.!?]{0,50}\.\s*(?:Il|Elle|Ça|Ca)\s+\w+\b.{0,40}\bpas\b'''
message = "Négation traînante : « X fait A. Il ne fait pas B. »"
fix = "Garder l'affirmation, couper la négation."
bad = ["Il ne vend pas de logiciel. Il ne fait pas non plus de conseil."]
good = ["Il vend du conseil."]

[[rule]]
id = "setup-dramatique"
family = "mise-en-scene"
scope = "sentence"
severity = "block"
pattern = '''^\W*Si\s+[^,]{5,60},\s*c['’]est\s+(?:pour|parce)'''
message = "Mise en scène « Si je vous écris, c'est pour... »"
fix = "Dire la chose directement."
bad = ["Si je reviens vers vous, c'est pour une raison simple."]
good = ["Si vous venez, apportez votre deck."]

# ---------------------------------------------------------------- intensificateurs

[[rule]]
id = "intensificateur-creux"
family = "intensificateur"
severity = "block"
pattern = '''\b(?:un|une|d['’]un|d['’]une|le|la|les|de)\s+(?:vrai|vraie|vrais|vraies)\s+[a-zà-ÿ]|\btout à fait\b|\bde loin (?:le|la|les)\b|\bpas moins de\b|\bbel et bien\b|\blittéralement\b|\bincontournables?\b|\bau cœur de\b|\bsans plus attendre\b'''
message = "Intensificateur creux posé à la place d'un fait."
fix = "Écrire le chiffre, le nom ou le fait précis."
bad = ["C'est un vrai chiffre à regarder.", "Une charge tout à fait banale.", "Un rendez-vous incontournable."]
good = ["3 000 utilisateurs actifs en décembre."]

[[rule]]
id = "adverbe-creux"
family = "intensificateur"
severity = "warn"
pattern = '''\b(?:vraiment|réellement|parfaitement|extrêmement|absolument|véritablement|pleinement|profondément|indéniablement|incontestablement)\b|\btrès (?:bien|bon|bonne|simple|efficace)\b'''
message = "Adverbe d'insistance sans contenu."
fix = "Supprimer le mot, ou le remplacer par la mesure."
bad = ["C'est vraiment utile."]
good = ["C'est utile : 2 heures gagnées par semaine."]

[[rule]]
id = "adjectif-evaluatif"
family = "intensificateur"
severity = "warn"
pattern = '''\b(?:un|une|le|la|les)\s+[\wÀ-ÿ]+\s+(?:crucial|cruciale|essentiel|essentielle|clé|majeur|majeure)\b|\bgrand(?:e)? (?:atout|avantage|force)\b'''
message = "Adjectif évaluatif à la place d'un fait."
fix = "Dire en quoi : chiffre, conséquence, nom."
bad = ["Un point crucial du contrat."]
good = ["L'article 4 du contrat fixe la pénalité."]

[[rule]]
id = "apposition-demonstrative"
family = "mise-en-scene"
severity = "block"
pattern = '''\b(?:la|le|un|une|second|seconde|deuxième|troisième|dernier|dernière)\s+[\wÀ-ÿ]+,\s*(?:celui|celle|ceux|celles)\s+(?:qui|que|qu['’]|dont)\b|\b(?:celui|celle|ceux|celles|le seul|la seule)\s+qui (?:compte|comptent|vaille|importe)\b|\bce qui compte (?:vraiment|le plus|réellement)\b'''
message = "Annonce d'importance : « Deuxième sujet, celui qui compte »."
fix = "Énoncer le sujet."
bad = ["Deuxième sujet, celui qui compte.", "Ce qui compte vraiment, c'est la marge."]
good = ["Deuxième sujet : la marge."]

# ---------------------------------------------------------------- questions

[[rule]]
id = "question-rhetorique"
family = "mise-en-scene"
severity = "block"
pattern = '''\?\s*(?:Parce qu|Réponse\s*:|Eh bien|Oui\.|Non\.|Simple\s*:)'''
message = "Question posée pour amener sa propre réponse."
fix = "Affirmer. Garder la question seulement si le lecteur se la pose."
bad = ["Pourquoi ça marche ? Parce que le client paie d'avance."]
good = ["Le client paie d'avance, ce qui finance le stock."]

[[rule]]
id = "question-reponse"
family = "mise-en-scene"
check = "question_reponse"
severity = "warn"
message = "Question suivie d'une réponse de quatre mots ou moins."
fix = "Donner l'information sans la mettre en scène."
bad = ["Le résultat de la levée ? Dévastateur."]
good = ["La levée a échoué : 0 € sur 500 000 € visés."]

# ---------------------------------------------------------------- phrase qui ne fait rien

[[rule]]
id = "verbe-faible"
family = "phrase-faible"
severity = "warn"
escalate_at = 3
pattern = '''\bsert de\b|\bfait office de\b|\bpossède (?:un|une|des|le|la|les)\b|\bconstitue (?:un|une|le|la)\b|\breprésente (?:un|une|le|la)\b|\bs['’]avère\b|\bse révèle\b|\bs['’]impose comme\b|\bse positionne comme\b|\bapparaît comme\b|\bjoue un rôle\b|\bse veut\b|\bdispose d(?:['’]un|['’]une|e nombreux)\b|\brevêt\b'''
message = "Verbe de liaison qui ne fait rien arriver."
fix = "Préférer « est » ou « a »."
bad = ["Cette fonction sert de passerelle.\n\nLa ville possède une riche histoire.\n\nLe module constitue une base."]
good = ["Cette fonction relie les deux bases."]

[[rule]]
id = "fausse-amplitude"
family = "phrase-faible"
severity = "block"
pattern = '''\bde\s+(?:la\s+|l['’]|le\s+)?[\wÀ-ÿ]+\s+à\s+(?:la\s+|l['’]|le\s+)?[\wÀ-ÿ]+,?\s*(?:jusqu['’]à|en passant par|voire)\b|\bde\s+A\s+à\s+Z\b|\ben passant par\b|\bà tous les (?:niveaux|étages)\b'''
message = "Balayage « de X à Y, en passant par Z »."
fix = "Nommer les éléments réels, ou couper."
bad = ["De la stratégie à l'exécution, jusqu'à la culture.", "On vous accompagne de A à Z."]
good = ["Le train va de Paris à Lyon."]

[[rule]]
id = "empilement-precautions"
family = "phrase-faible"
check = "hedges"
severity = "block"
message = "Deux précautions dans la même phrase."
fix = "Prendre position. Une seule nuance justifiée par texte."
bad = ["Il semble que ce soit généralement le cas."]
good = ["C'est le cas dans 8 dossiers sur 10."]

[rule.params]
min = 2
hedges = [
  "sans doute", "peut-être", "il semble", "il semblerait", "on pourrait", "dans une certaine mesure",
  "généralement", "souvent", "parfois", "il convient", "notons que", "à noter que", "cela dit", "certes",
  "toutefois", "néanmoins", "en quelque sorte", "relativement", "plus ou moins", "en général",
  "la plupart du temps", "a priori", "potentiellement", "d['’]une certaine façon",
]

[[rule]]
id = "voix-passive"
family = "phrase-faible"
check = "passive"
severity = "warn"
message = "Voix passive : celui qui agit disparaît de la phrase."
fix = "Nommer qui fait l'action : « on chiffre », « vous choisissez »."
bad = ["Le travail est chiffré au prix du marché."]
good = ["On chiffre le travail au prix du marché.", "Elle est arrivée à 9 h."]

[rule.params]
participes_irreguliers = [
  "fait", "faite", "faits", "faites", "mis", "mise", "mises", "pris", "prise", "prises", "écrit", "écrite", "écrits",
  "dit", "dite", "dits", "inclus", "incluse", "compris", "comprise", "conçu", "conçue", "reçu", "reçue",
  "vu", "vue", "vus", "vues", "ouvert", "ouverte", "couvert", "offert", "tenu", "tenue", "retenu", "remis", "remise",
  "défini", "définie", "rendu", "rendue", "vendu", "vendue", "perçu", "perçue", "admis", "admise", "transmis", "transmise",
  "choisi", "choisie", "choisis", "choisies", "fini", "finie", "rempli", "remplie", "établi", "établie", "suivi", "suivie",
  "réuni", "réunie", "saisi", "saisie", "garanti", "garantie", "obtenu", "obtenue", "soutenu", "soutenue", "maintenu",
  "maintenue", "prévu", "prévue", "prévus", "prévues", "connu", "connue", "connus", "reconnu", "reconnue", "entendu",
  "attendu", "attendue", "conclu", "conclue", "résolu", "résolue", "exclu", "exclue", "lu", "lue",
]
participes_actifs = [
  "allé", "allée", "allés", "allées", "arrivé", "arrivée", "arrivés", "arrivées", "entré", "entrée", "entrés", "entrées",
  "monté", "montée", "montés", "né", "née", "nés", "passé", "passée", "passés", "resté", "restée", "restés", "restées",
  "retourné", "retournée", "tombé", "tombée", "tombés", "venu", "venue", "venus", "devenu", "devenue", "devenus",
  "parti", "partie", "partis", "sorti", "sortie", "sortis", "descendu", "descendue", "décédé", "mort", "morte",
]

[[rule]]
id = "staccato"
family = "rythme"
check = "staccato"
severity = "warn"
message = "Trois phrases de quatre mots ou moins d'affilée."
fix = "Fusionner en une phrase qui porte un fait."
bad = ["Vous prouvez. Vous vendez. Vous gagnez."]
good = ["Vous prouvez la demande en vendant 40 précommandes."]

[[rule]]
id = "regle-de-trois"
family = "rythme"
severity = "warn"
escalate_at = 4
flags = ""
pattern = '''\b([a-zà-ÿ]{4,}), ([a-zà-ÿ]{4,}) et ([a-zà-ÿ]{4,})\b'''
message = "Énumération ternaire réflexe."
fix = "Garder le meilleur élément. Ou deux. Ou quatre, dont un très précis."
bad = ["Un outil rapide, fiable et évolutif."]
good = ["Un outil rapide."]

[[rule]]
id = "anaphore"
family = "rythme"
check = "anaphore"
severity = "block"
message = "Trois phrases d'affilée ouvertes par le même mot."
fix = "Varier, sauf si la répétition produit un effet délibéré."
bad = ["Nous créons. Nous livrons. Nous itérons."]
good = ["Nous créons le produit, puis l'équipe le livre."]

[[rule]]
id = "chute-sans-fait"
family = "rythme"
scope = "last_sentence"
kinds = ["paragraph"]
severity = "warn"
escalate_at = 4
flags = ""
pattern = '''^(?:C['’]est (?:le but|la clé|tout|ça|simple|binaire|mérité|logique|aussi simple que ça)\s*[.!]|Point\.|Point final\.|Rien de plus\.|Le reste suit\.|Tout est là\.|Tout se joue là\.|Simple\.|Voilà\.|Tout simplement\.|Ni plus,? ni moins\.|Ça change tout\.|Ça compte\.|Ça paie\.|Ça marche\.|Rien ne remplace [^.]{0,30}\.)\s*$'''
message = "Chute courte qui claque sans apporter de fait."
fix = "Supprimer la chute, ou la remplacer par un fait."
bad = ["On teste avant de coder. Le reste suit."]
good = ["On teste avant de coder. Le test coûte 200 €."]

[[rule]]
id = "connecteur-scolaire"
family = "rythme"
scope = "first_sentence"
kinds = ["paragraph"]
severity = "warn"
escalate_at = 3
flags = ""
pattern = '''^(?:Par ailleurs|En effet|Néanmoins|Toutefois|De plus|En outre|Premièrement|Deuxièmement|Troisièmement|Finalement|Ainsi|Dès lors|De surcroît|Qui plus est),'''
message = "Connecteur scolaire en tête de paragraphe."
fix = "Enchaîner sur le fait, sans connecteur."
bad = ["En effet, le marché recule."]
good = ["Le marché recule de 3 %."]

[[rule]]
id = "voici-transition"
family = "rythme"
scope = "first_sentence"
kinds = ["paragraph"]
severity = "warn"
escalate_at = 3
flags = ""
pattern = '''^(?:Voici|Voilà) '''
message = "« Voici » en tête de paragraphe : le texte annonce au lieu de donner."
fix = "Donner l'information sans l'annoncer."
bad = ["Voici les trois étapes à suivre."]
good = ["Trois étapes : signer, payer, livrer."]

[[rule]]
id = "c-est-la-que"
family = "rythme"
severity = "warn"
escalate_at = 2
pattern = '''\bc['’]est (?:précisément |exactement |justement )?(?:là|ici) qu(?:e |['’])'''
message = "Pivot « c'est là que »."
fix = "Dire ce qui se passe, sans pivot."
bad = ["C'est là que tout se joue."]
good = ["Le contrat se signe le 3 mars."]

# ---------------------------------------------------------------- images et concepts

[[rule]]
id = "imaginez"
family = "image"
severity = "block"
pattern = '''\bimaginez(?:-vous)? (?:un|une|des|que|qu['’]|le|la|les|vous)\b'''
message = "Scène imaginaire posée à la place du cas réel."
fix = "Décrire ce qui s'est passé, avec le fait réel."
bad = ["Imaginez une autoroute pour vos données."]
good = ["Notre client a divisé son temps de saisie par trois."]

[[rule]]
id = "analogie-reflexe"
family = "image"
severity = "warn"
escalate_at = 2
pattern = '''\bc['’]est comme si\b|\bpensez à (?:un|une)\b|\bvoyez (?:ça|cela) comme\b|\bà la manière d(?:['’]un|['’]une)\b|\bc['’]est l['’]équivalent d(?:['’]un|['’]une|e)\b|\bcomme (?:un|une) [\wÀ-ÿ]+ (?:pour|qui)\b'''
message = "Analogie de réflexe."
fix = "Garder l'analogie seulement si elle éclaire l'idée."
bad = ["C'est comme si vous aviez un copilote."]
good = ["Le logiciel propose la réponse, vous la validez."]

[[rule]]
id = "concept-invente"
family = "image"
severity = "warn"
escalate_at = 2
pattern = '''\b(?:le paradoxe|la dérive|le syndrome|le piège|l['’]illusion|la malédiction|le dilemme|l['’]effet|le biais|la spirale)\s+(?:de la|de l['’]|du|des|de)\s+[a-zà-ÿ]{4,}'''
message = "Nom de théorie posé sur un phénomène ordinaire."
fix = "Décrire simplement le phénomène."
bad = ["C'est le paradoxe de la supervision."]
good = ["Plus on supervise, moins l'équipe décide seule."]

[[rule]]
id = "metaphore-usee"
family = "image"
check = "repetition"
severity = "warn"
message = "La même image usée deux fois dans le texte."
fix = "L'employer une fois, puis avancer."
bad = ["Le levier de croissance.\n\nUn autre levier simple."]
good = ["Le levier de croissance."]

[rule.params]
min = 2
terms = [
  "aventures?", "voyages?", "adn", "colonne vertébrale", "boussoles?", "moteurs?", "leviers?", "pierre angulaire",
  "graines?", "chef d['’]orchestre", "couteau suisse", "marathons?", "jungle", "iceberg", "épine dorsale", "socles?",
  "tremplins?", "fil rouge", "pierre à l['’]édifice", "recettes?", "carburant", "terrain de jeu",
]

[[rule]]
id = "ecosysteme"
family = "vocabulaire"
check = "repetition"
severity = "warn"
message = "« écosystème » répété : le mot remplace marché, réseau, milieu."
fix = "Le mot exact : marché, réseau, milieu, ville."
params = { min = 3, terms = ["écosystèmes?"] }
bad = ["L'écosystème.\n\nCet écosystème.\n\nUn écosystème."]
good = ["L'écosystème du sol."]

# ---------------------------------------------------------------- sujets et agents

[[rule]]
id = "objet-agent"
family = "agent"
check = "objet_agent"
severity = "block"
message = "Une chose reçoit un verbe d'action humain : « le marché tranche », « les chiffres parlent »."
fix = "Mettre en sujet la personne qui agit : vous, on, le jury, les acheteurs."
bad = ["Le chapeau décide du reste.", "Les chiffres parlent d'eux-mêmes."]
good = ["Le jury tranche à 18 h.", "Les assureurs refusent de couvrir ce risque.", "Ce mot veut dire « pierre ».", "Il a dit ce qu'on sait déjà."]

